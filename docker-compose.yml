# Local PostgreSQL for development:  docker compose up -d
# Then set DATABASE_URL="postgresql://postgres:postgres@localhost:5432/kings_body_empire?schema=public"
services:
  db:
    image: postgres:16-alpine
    container_name: kbe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kings_body_empire
    ports:
      - "5432:5432"
    volumes:
      - kbe-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kings_body_empire"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kbe-db-data:
