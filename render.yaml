# Render Blueprint for Kings Body Empire
#
# Deploy: Render Dashboard → New → Blueprint → pick this repo.
# Render reads this file, creates the web service and asks you for the
# `sync: false` values below (nothing secret is stored in git).
#
# Before the first deploy:
#   1. Migrations run automatically on every boot via `npm run start:render`
#      (prisma migrate deploy && next start), so the tables create themselves
#      as long as DATABASE_URL below is set. To seed the admin/catalogue, run
#      once from your machine:
#        DATABASE_URL="<production url>" npm run db:seed      # optional
#   2. NEXTAUTH_URL / NEXT_PUBLIC_SITE_URL are pinned to the live URL below.
#      If you rename the service or add a custom domain, update BOTH to the
#      new URL (no trailing slash) and redeploy.
#
# WARNING: this file is ONLY read when the service is created via
# Render Dashboard -> New -> Blueprint. A manually-created Web Service
# ignores render.yaml completely — no env vars, no generated secret.
# If you created the service by hand, copy every env var below into
# Dashboard -> your service -> Environment yourself (see
# docs/DEPLOYMENT.md, Track B2).
#
# Deploying from a branch other than `main`? Change `branch:` below.

services:
  - type: web
    name: kings-body-empire
    runtime: node
    plan: free # free instances sleep after 15 minutes of inactivity
    region: frankfurt # closest to Nigeria; also: oregon, ohio, virginia, singapore
    branch: main
    autoDeploy: true

    # `npm ci` runs the postinstall hook (prisma generate); `npm run build`
    # runs `prisma generate && next build`.
    buildCommand: npm ci && npm run build
    # `start:render` applies pending Prisma migrations, then starts Next
    # honouring Render's $PORT — a fresh database becomes usable with no
    # manual migration step.
    startCommand: npm run start:render
    healthCheckPath: /api/health

    envVars:
      - key: NODE_VERSION
        value: "20"

      # ---- Database -------------------------------------------------------
      # Direct Supabase URL (port 5432) or the pooler with
      # ?pgbouncer=true&connection_limit=1 appended.
      - key: DATABASE_URL
        sync: false

      # ---- Auth (NextAuth) ------------------------------------------------
      - key: NEXTAUTH_SECRET
        generateValue: true # Render generates a strong secret for you
      - key: NEXTAUTH_URL
        # Must equal the deployed URL exactly, with no trailing slash.
        # (The app can fall back to RENDER_EXTERNAL_URL, but explicit wins;
        # update this if you rename the service or add a custom domain.)
        value: https://kings-body-empire.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://kings-body-empire.onrender.com # same value as NEXTAUTH_URL

      # ---- Payments (optional) -------------------------------------------
      - key: PAYSTACK_SECRET_KEY
        sync: false # leave empty to run with checkout disabled
      - key: NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY
        sync: false

      # ---- Email (password reset) ----------------------------------------
      # Leave both blank to log reset emails to the Render console.
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_URL
        sync: false
      - key: EMAIL_FROM
        sync: false

      # ---- Branding / behaviour ------------------------------------------
      - key: NEXT_PUBLIC_TIMEZONE
        value: Africa/Lagos
      - key: NEXT_PUBLIC_SUPPORT_EMAIL
        sync: false
      - key: NEXT_PUBLIC_WHATSAPP_URL
        sync: false
      - key: NEXT_PUBLIC_INSTAGRAM_URL
        sync: false
      # Never create the demo client on a public deployment.
      - key: SEED_DEMO_CLIENT
        value: "false"
